<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Football Analytics Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --border:    #30363d;
      --green:     #3fb950;
      --green-dim: #1a4d2a;
      --text:      #e6edf3;
      --muted:     #8b949e;
      --red:       #f85149;
      --yellow:    #d29922;
      --blue:      #58a6ff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    header .badge {
      background: var(--green-dim);
      color: var(--green);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid var(--green);
      letter-spacing: .5px;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    header p  { font-size: 13px; color: var(--muted); margin-left: auto; }

    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      height: calc(100vh - 57px);
    }

    /* ── Sidebar ── */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 20px 0;
    }
    .sidebar-section { margin-bottom: 8px; }
    .sidebar-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .8px;
      text-transform: uppercase;
      padding: 6px 20px;
    }
    .endpoint-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 20px;
      background: none;
      border: none;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      transition: background .12s;
    }
    .endpoint-btn:hover  { background: rgba(255,255,255,.05); }
    .endpoint-btn.active { background: var(--green-dim); color: var(--green); }
    .method {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
      min-width: 32px;
      text-align: center;
    }
    .get  { background: #0d3b52; color: var(--blue); }
    .post { background: #2d2a16; color: var(--yellow); }

    .team-selector {
      padding: 12px 16px;
      margin: 0 12px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .team-selector label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
      letter-spacing: .5px;
      text-transform: uppercase;
    }
    .team-selector select,
    .team-selector input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .team-selector select:last-child,
    .team-selector input:last-child { margin-bottom: 0; }

    /* ── Main panel ── */
    .main {
      overflow-y: auto;
      padding: 28px 32px;
    }

    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      gap: 12px;
    }
    .placeholder svg { opacity: .3; }
    .placeholder p { font-size: 14px; }

    .result-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .result-header h2 { font-size: 17px; font-weight: 600; flex: 1; }
    .result-url {
      font-family: monospace;
      font-size: 12px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 440px;
    }
    .result-meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .result-meta span { color: var(--green); font-weight: 600; }

    .status-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 10px;
    }
    .status-ok  { background: var(--green-dim); color: var(--green); }
    .status-err { background: #3b1212; color: var(--red); }

    /* table */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead th {
      background: var(--surface);
      color: var(--muted);
      font-weight: 600;
      font-size: 11px;
      letter-spacing: .5px;
      text-transform: uppercase;
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,.03); }
    tbody td { padding: 10px 14px; color: var(--text); white-space: nowrap; }

    .num  { font-variant-numeric: tabular-nums; font-family: monospace; }
    .goal { color: var(--green); font-weight: 600; }
    .high { color: var(--yellow); }

    /* stat cards for single-row results */
    .stat-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 14px;
      margin-top: 4px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
    }
    .stat-card .label { font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
    .stat-card .value { font-size: 24px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
    .stat-card .value.green { color: var(--green); }
    .stat-card .value.yellow { color: var(--yellow); }

    /* overview dashboard */
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .overview-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
    }
    .overview-section h3 {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 16px;
    }
    .overview-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .overview-row:last-child { border-bottom: none; }
    .overview-row .ov-label { color: var(--muted); }
    .overview-row .ov-value { font-weight: 700; font-variant-numeric: tabular-nums; }
    .ov-value.green  { color: var(--green); }
    .ov-value.yellow { color: var(--yellow); }
    .ov-value.red    { color: var(--red); }
    .bar-wrap { margin-top: 12px; }
    .bar-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 5px; }
    .bar-track { background: var(--bg); border-radius: 4px; height: 6px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 4px; background: var(--green); transition: width .4s ease; }
    .bar-fill.yellow { background: var(--yellow); }
    .bar-fill.blue   { background: var(--blue); }

    /* shot map filters */
    .shot-filter {
      display: flex; align-items: center; gap: 8px;
      width: 100%; background: none;
      border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); padding: 7px 10px; font-size: 12px;
      cursor: pointer; text-align: left; transition: opacity .15s;
      margin-bottom: 6px;
    }
    .shot-filter .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .shot-filter .cnt { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
    .shot-filter.off  { opacity: .3; }
    thead th.sortable { cursor: pointer; user-select: none; }
    thead th.sortable:hover { color: var(--text); }
    thead th.sortable[data-asc="true"]::after  { content: ' ↑'; color: var(--green); }
    thead th.sortable[data-asc="false"]::after { content: ' ↓'; color: var(--green); }
    #shot-map-container.hide-goal        .outcome-goal        { display: none; }
    #shot-map-container.hide-saved       .outcome-saved       { display: none; }
    #shot-map-container.hide-off-target  .outcome-off-target  { display: none; }
    #shot-map-container.hide-blocked     .outcome-blocked     { display: none; }

    .shot-stat { background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
    .shot-stat .label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
    .shot-stat .value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }

    /* loading */
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      background: #1f0c0c;
      border: 1px solid #5a1a1a;
      border-radius: 8px;
      padding: 16px 20px;
      color: var(--red);
      font-size: 13px;
    }

    .pitch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    .shot-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 12px;
    }
    .shot-chip .player { font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .shot-chip .xg-val { color: var(--blue); font-variant-numeric: tabular-nums; }
    .shot-chip.is-goal { border-color: var(--green); background: var(--green-dim); }
    .shot-chip.is-goal .player { color: var(--green); }
  </style>
</head>
<body>

<header>
  <span>⚽</span>
  <h1>Football Analytics Dashboard</h1>
  <span class="badge">WebR + Express</span>
  <p id="headerMeta">Loading datasets…</p>
</header>

<div class="layout">

  <!-- Sidebar -->
  <nav class="sidebar">

    <div class="team-selector">
      <label>Team</label>
      <select id="teamSelect"><option value="">Loading…</option></select>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">General</div>
      <button class="endpoint-btn" data-path="/ping" data-method="GET" data-label="Health Check">
        <span class="method get">GET</span> /ping
      </button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Team Stats</div>
      <button class="endpoint-btn" data-path="/team-stats/overview" data-method="GET" data-label="Team Comparison" data-no-team="true">
        <span class="method get">GET</span> /overview
      </button>
      <button class="endpoint-btn" data-path="/team-stats/shooting" data-method="GET" data-label="All Teams Shooting" data-no-team="true">
        <span class="method get">GET</span> /shooting
      </button>
      <button class="endpoint-btn" data-path="/team-stats/shooting/:team" data-method="GET" data-label="Player Shooting">
        <span class="method get">GET</span> /shooting/:team
      </button>
      <button class="endpoint-btn" data-path="/team-stats/passing/:team" data-method="GET" data-label="Pass Accuracy">
        <span class="method get">GET</span> /passing/:team
      </button>
      <button class="endpoint-btn" data-path="/team-stats/top-passers/:team" data-method="GET" data-label="Top Passers">
        <span class="method get">GET</span> /top-passers/:team
      </button>
      <button class="endpoint-btn" data-path="/team-stats/shot-map/:team" data-method="GET" data-label="Shot Map">
        <span class="method get">GET</span> /shot-map/:team
      </button>
      <button class="endpoint-btn" data-path="/team-stats/dribbles/:team" data-method="GET" data-label="Dribble Stats">
        <span class="method get">GET</span> /dribbles/:team
      </button>
      <button class="endpoint-btn" data-path="/team-stats/pressure/:team" data-method="GET" data-label="Pressure Performance">
        <span class="method get">GET</span> /pressure/:team
      </button>
    </div>

    <!-- <div class="sidebar-section">
      <div class="sidebar-label">Stats (POST)</div>
      <button class="endpoint-btn" data-path="/stats/summary" data-method="POST" data-label="Summary Stats" data-body='{"values":[23,45,67,12,89,34,56]}'>
        <span class="method post">POST</span> /summary
      </button>
      <button class="endpoint-btn" data-path="/stats/t-test" data-method="POST" data-label="T-Test" data-body='{"x":[23,45,67,34],"y":[55,72,61,48]}'>
        <span class="method post">POST</span> /t-test
      </button>
      <button class="endpoint-btn" data-path="/stats/kmeans" data-method="POST" data-label="K-Means" data-body='{"data":[[1,2],[3,4],[5,6],[7,8],[2,1],[4,3]],"k":2}'>
        <span class="method post">POST</span> /kmeans
      </button>
      <button class="endpoint-btn" data-path="/stats/forecast-hw" data-method="POST" data-label="HW Forecast" data-body='{"values":[100,120,130,110,140,135,150],"horizon":5}'>
        <span class="method post">POST</span> /forecast-hw
      </button>
    </div> -->

  <div style="padding:12px 20px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);line-height:1.6;margin-top:auto">
    Data provided by <a href="https://statsbomb.com" target="_blank" style="color:var(--muted);text-decoration:underline">StatsBomb</a>.
    Please use responsibly and credit StatsBomb as your data source.
  </div>
  </nav>

  <!-- Main -->
  <main class="main" id="main">
    <div class="placeholder">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/>
      </svg>
      <p>Select an endpoint from the sidebar to fetch data</p>
    </div>
  </main>

</div>

<script>
  const main       = document.getElementById('main');
  const teamSelect = document.getElementById('teamSelect');
  const headerMeta = document.getElementById('headerMeta');
  let activeBtn    = null;
  let activeChart  = null;
  let pendingChart = null;

  // Populate team selector from available datasets
  async function loadDatasets() {
    try {
      const res      = await fetch('/team-stats/datasets');
      const json     = await res.json();
      const datasets = json.data;

      if (!Array.isArray(datasets) || !datasets.length) {
        teamSelect.innerHTML = '<option value="">No datasets found</option>';
        headerMeta.textContent = 'No datasets loaded';
        return;
      }

      const rows = normaliseData(datasets);
      teamSelect.innerHTML = rows.map(d =>
        `<option value="${d.team}">${d.team} · ${d.season}</option>`
      ).join('');

      const first = rows[0];
      headerMeta.textContent = `${first.competition} · StatsBomb`;
    } catch (err) {
      teamSelect.innerHTML = '<option value="">Error loading</option>';
      headerMeta.textContent = 'Failed to load datasets';
    }
  }

  loadDatasets();

  document.querySelectorAll('.endpoint-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (activeBtn) activeBtn.classList.remove('active');
      btn.classList.add('active');
      activeBtn = btn;
      fetchEndpoint(btn);
    });
  });

  teamSelect.addEventListener('change', () => {
    if (activeBtn) fetchEndpoint(activeBtn);
  });

  async function fetchEndpoint(btn) {
    const rawPath  = btn.dataset.path;
    const method   = btn.dataset.method;
    const label    = btn.dataset.label;
    const body     = btn.dataset.body;
    const noTeam   = btn.dataset.noTeam === 'true';
    const team     = teamSelect.value;
    const url      = rawPath.replace(':team', encodeURIComponent(team));

    main.innerHTML = `<div style="padding:8px 0;color:var(--muted);font-size:14px"><span class="spinner"></span>Fetching <code>${url}</code>…</div>`;

    const start = Date.now();
    try {
      const opts = { method };
      if (body) {
        opts.headers = { 'Content-Type': 'application/json' };
        opts.body = body;
      }
      const res  = await fetch(url, opts);
      const json = await res.json();
      const ms   = Date.now() - start;
      render(label, url, json, res.status, ms, rawPath);
    } catch (err) {
      main.innerHTML = `
        <div class="result-header"><h2>${label}</h2></div>
        <div class="error-box">Network error: ${err.message}</div>`;
    }
  }

  function render(label, url, json, status, ms, rawPath) {
    const ok  = json.success !== false;
    const pill = ok
      ? `<span class="status-pill status-ok">200 OK</span>`
      : `<span class="status-pill status-err">${status} Error</span>`;

    let body = '';

    if (!ok) {
      body = `<div class="error-box">${json.message || 'Request failed'}</div>`;
    } else if (rawPath === '/ping') {
      body = `<div class="stat-cards"><div class="stat-card"><div class="label">Status</div><div class="value green">Alive</div></div><div class="stat-card"><div class="label">Message</div><div class="value" style="font-size:15px">${json.message}</div></div></div>`;
    } else if (rawPath === '/team-stats/overview') {
      body = renderComparison(json.data);
    } else if (rawPath === '/team-stats/overview/:team') {
      body = renderOverview(json.data);
    } else if (rawPath === '/team-stats/passing/:team') {
      body = renderPassCards(json.data);
    } else if (rawPath === '/team-stats/shot-map/:team') {
      body = renderShotMap(json.data);
    } else if (rawPath === '/stats/t-test') {
      const pv = json.data?.p_value ?? json.data;
      body = `<div class="stat-cards">
        <div class="stat-card"><div class="label">p-value</div><div class="value ${pv < 0.05 ? 'green' : 'yellow'}">${typeof pv === 'number' ? pv.toFixed(4) : pv}</div></div>
        <div class="stat-card"><div class="label">Significant?</div><div class="value ${pv < 0.05 ? 'green' : 'yellow'}">${pv < 0.05 ? 'Yes (p<0.05)' : 'No'}</div></div>
      </div>`;
    } else {
      body = renderTable(json.data);
    }

    if (activeChart) { activeChart.destroy(); activeChart = null; }

    main.innerHTML = `
      <div class="result-header">
        <h2>${label}</h2>
        ${pill}
        <span class="result-url">${url}</span>
      </div>
      <div class="result-meta">Returned in <span>${ms}ms</span> · ${new Date().toLocaleTimeString()}</div>
      ${body}`;

    if (pendingChart) { activeChart = initOverviewChart(pendingChart); pendingChart = null; }
  }

  function renderOverview(data) {
    if (!data) return '<p style="color:var(--muted)">No data</p>';
    const rows = normaliseData(data);
    const d    = rows[0] || {};

    const xgOver  = parseFloat(d.xg_overperformance) || 0;
    const xgColor = xgOver >= 0 ? 'green' : 'red';
    const xgSign  = xgOver >= 0 ? '+' : '';

    function row(label, value, color = '') {
      return `<div class="overview-row"><span class="ov-label">${label}</span><span class="ov-value ${color}">${value ?? '—'}</span></div>`;
    }
    function bar(label, value, color = '') {
      const pct = Math.min(parseFloat(value) || 0, 100);
      return `<div class="bar-wrap"><div class="bar-meta"><span>${label}</span><span>${value}%</span></div><div class="bar-track"><div class="bar-fill ${color}" style="width:${pct}%"></div></div></div>`;
    }

    return `<div class="overview-grid">

      <div class="overview-section">
        <h3>Shooting</h3>
        ${row('Goals',           d.goals,       'green')}
        ${row('Total Shots',     d.total_shots)}
        ${row('Total xG',        d.total_xg,    'yellow')}
        ${row('xG Over/Under',   xgSign + xgOver, xgColor)}
        ${bar('Conversion Rate', d.conversion_rate)}
      </div>

      <div class="overview-section">
        <h3>Passing</h3>
        ${row('Total Passes', d.total_passes)}
        ${row('Key Passes',   d.key_passes, 'yellow')}
        ${bar('Pass Accuracy', d.pass_accuracy, 'blue')}
      </div>

      <div class="overview-section">
        <h3>Dribbling</h3>
        ${row('Attempts', d.dribble_attempts)}
        ${bar('Success Rate', d.dribble_success, 'yellow')}
      </div>

      <div class="overview-section">
        <h3>Pressure</h3>
        ${row('Actions Tracked', d.total_passes + d.total_shots + d.dribble_attempts)}
        ${bar('Under Pressure', d.pressure_pct, 'yellow')}
      </div>

    </div>`;
  }

  function renderPassCards(data) {
    if (!data) return '<p style="color:var(--muted)">No data</p>';
    const rows = normaliseData(data);
    const row  = rows[0] || {};
    const fields = [
      { key: 'total_passes', label: 'Total Passes' },
      { key: 'completed',    label: 'Completed' },
      { key: 'incomplete',   label: 'Incomplete' },
      { key: 'accuracy_pct', label: 'Accuracy %', suffix: '%', color: 'green' },
      { key: 'avg_length',   label: 'Avg Length (m)' },
      { key: 'key_passes',   label: 'Key Passes', color: 'yellow' },
    ];
    return `<div class="stat-cards">${fields.map(f => {
      const val = row[f.key];
      const display = val !== undefined ? val : '—';
      return `<div class="stat-card"><div class="label">${f.label}</div><div class="value ${f.color||''}">${display}${f.suffix||''}</div></div>`;
    }).join('')}</div>`;
  }

  window.sortCompare = function(th) {
    const table = th.closest('table');
    const idx   = Array.from(th.parentElement.children).indexOf(th);
    const asc   = th.dataset.asc !== 'true';
    table.querySelectorAll('thead th').forEach(h => h.dataset.asc = '');
    th.dataset.asc = String(asc);
    const tbody = table.querySelector('tbody');
    Array.from(tbody.querySelectorAll('tr'))
      .sort((a, b) => {
        const av = a.cells[idx].textContent.replace(/[+%]/g, '').trim();
        const bv = b.cells[idx].textContent.replace(/[+%]/g, '').trim();
        const an = parseFloat(av), bn = parseFloat(bv);
        if (!isNaN(an) && !isNaN(bn)) return asc ? an - bn : bn - an;
        return asc ? av.localeCompare(bv) : bv.localeCompare(av);
      })
      .forEach(r => tbody.appendChild(r));
  };

  function renderComparison(data) {
    if (!data) return '<p style="color:var(--muted)">No data</p>';
    const rows = normaliseData(data);
    if (!rows.length) return '<p style="color:var(--muted)">No datasets loaded — generate a dataset first</p>';

    const cols = [
      { key: 'team.name',          label: 'Team',        fmt: v => v,                                    num: false },
      { key: 'goals',              label: 'Goals',       fmt: v => v,                                    num: true  },
      { key: 'total_shots',        label: 'Shots',       fmt: v => v,                                    num: true  },
      { key: 'total_xg',          label: 'xG',          fmt: v => (+v).toFixed(2),                      num: true  },
      { key: 'conversion_rate',    label: 'Conv %',      fmt: v => (+v).toFixed(1) + '%',                num: true  },
      { key: 'xg_overperformance', label: 'xG ±',        fmt: v => { const n = +v; return (n >= 0 ? '+' : '') + n.toFixed(2); }, num: true },
      { key: 'pass_accuracy',      label: 'Pass Acc',    fmt: v => (+v).toFixed(1) + '%',                num: true  },
      { key: 'key_passes',         label: 'Key Passes',  fmt: v => v,                                    num: true  },
      { key: 'dribble_success',    label: 'Dribble %',   fmt: v => (+v).toFixed(1) + '%',                num: true  },
      { key: 'pressure_pct',       label: 'Pressure %',  fmt: v => (+v).toFixed(1) + '%',                num: true  },
    ];

    // Find best value per numeric column for highlighting
    const best = {};
    cols.filter(c => c.num && c.key !== 'pressure_pct').forEach(c => {
      best[c.key] = Math.max(...rows.map(r => parseFloat(r[c.key]) || -Infinity));
    });

    const header = cols.map(c =>
      `<th class="sortable" onclick="sortCompare(this)">${c.label}</th>`
    ).join('');

    const body = rows.map(r => `<tr>${cols.map(c => {
      const v       = r[c.key];
      const display = v !== null && v !== undefined ? c.fmt(v) : '—';
      const isTop   = c.num && best[c.key] !== undefined && parseFloat(v) === best[c.key];
      return `<td class="${c.num ? 'num' : ''} ${isTop ? 'goal' : ''}">${display}</td>`;
    }).join('')}</tr>`).join('');

    pendingChart = {
      teams:    rows.map(r => r['team.name']),
      goals:    rows.map(r => parseFloat(r.goals)    || 0),
      xg:       rows.map(r => parseFloat(r.total_xg) || 0),
      passAcc:  rows.map(r => parseFloat(r.pass_accuracy)   || 0),
      dribble:  rows.map(r => parseFloat(r.dribble_success) || 0),
    };

    return `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px 20px;margin-bottom:20px">
        <canvas id="overview-chart" height="110"></canvas>
      </div>
      <p style="font-size:12px;color:var(--muted);margin-bottom:12px">
        Click any column header to sort · Green = best in category
      </p>
      <div class="table-wrap">
        <table><thead><tr>${header}</tr></thead><tbody>${body}</tbody></table>
      </div>`;
  }

  window.shotFilterToggle = function(btn) {
    const container = document.getElementById('shot-map-container');
    btn.classList.toggle('off');
    container.classList.toggle('hide-' + btn.dataset.filter);
  };

  function renderShotMap(data) {
    if (!data) return '<p style="color:var(--muted)">No data</p>';
    const rows = normaliseData(data);
    if (!rows.length) return '<p style="color:var(--muted)">No shots found</p>';

    function outcomeCategory(outcome) {
      if (outcome === 'Goal')                 return 'goal';
      if (outcome && outcome.includes('Saved')) return 'saved';
      if (outcome === 'Blocked')              return 'blocked';
      return 'off-target';
    }
    function categoryColor(cat) {
      return { goal: '#3fb950', saved: '#58a6ff', blocked: '#8b949e', 'off-target': '#d29922' }[cat];
    }
    function shotRadius(xg) {
      return Math.max(1.4, Math.min(4.5, (parseFloat(xg) || 0) * 18 + 1.2));
    }

    // Count per category for filter labels
    const counts = { goal: 0, saved: 0, blocked: 0, 'off-target': 0 };
    rows.forEach(r => counts[outcomeCategory(r.shot_outcome)]++);

    // Landscape orientation: goal at top, halfway line at bottom
    // svgX = sbY (pitch width → horizontal)
    // svgY = 120 - sbX (pitch length inverted → vertical, goal at 0)
    const circles = rows.map(r => {
      const svgX   = parseFloat(r.y).toFixed(2);
      const svgY   = (120 - parseFloat(r.x)).toFixed(2);
      const isGoal = r.is_goal === true || r.is_goal === 'true' || r.is_goal === 1;
      const cat    = outcomeCategory(r.shot_outcome);
      const color  = categoryColor(cat);
      const xgVal  = (+r.xg || 0).toFixed(3);
      return `<circle cx="${svgX}" cy="${svgY}" r="${shotRadius(r.xg)}"
        fill="${color}" fill-opacity="${isGoal ? 1 : 0.7}"
        stroke="${isGoal ? 'white' : 'none'}" stroke-width="0.5"
        class="outcome-${cat}">
        <title>${r.player}  ${r.minute}' · ${r.shot_outcome} · xG ${xgVal}</title>
      </circle>`;
    }).join('');

    const totalShots = rows.length;
    const totalGoals = counts.goal;
    const totalXg    = rows.reduce((s, r) => s + (+r.xg || 0), 0).toFixed(2);

    const filters = [
      { key: 'goal',       label: 'Goal',       color: '#3fb950', stroke: 'white' },
      { key: 'saved',      label: 'Saved',      color: '#58a6ff', stroke: 'none'  },
      { key: 'off-target', label: 'Off Target', color: '#d29922', stroke: 'none'  },
      { key: 'blocked',    label: 'Blocked',    color: '#8b949e', stroke: 'none'  },
    ].map(f => `
      <button class="shot-filter" data-filter="${f.key}" onclick="shotFilterToggle(this)">
        <svg width="9" height="9"><circle cx="4.5" cy="4.5" r="4" fill="${f.color}" stroke="${f.stroke}" stroke-width="1"/></svg>
        ${f.label} <span class="cnt">${counts[f.key]}</span>
      </button>`).join('');

    // viewBox: 80 wide × 60 tall (landscape, 4:3)
    // Pitch markings in landscape coords (goal at top, halfway at bottom)
    return `
      <div id="shot-map-container" style="display:flex;gap:20px;align-items:flex-start">

        <svg viewBox="-1 -3 82 65" style="flex:1;min-width:0;max-height:56vh;display:block;border-radius:8px" xmlns="http://www.w3.org/2000/svg">
          <!-- Background -->
          <rect x="-1" y="-3" width="82" height="65" fill="#161b22"/>
          <rect x="0"  y="0"  width="80" height="60" fill="#1e3a1a" rx="1"/>

          <!-- Halfway line (bottom, dashed) -->
          <line x1="0" y1="60" x2="80" y2="60" stroke="#3d6b3d" stroke-width="0.4" stroke-dasharray="2 2"/>

          <!-- Centre circle (partial arc visible above halfway line) -->
          <path d="M 30 60 A 10 10 0 0 0 50 60" fill="none" stroke="#3d6b3d" stroke-width="0.5"/>
          <circle cx="40" cy="60" r="0.6" fill="#3d6b3d"/>

          <!-- Penalty area: sbX 102-120 → svgY 0-18, sbY 18-62 → svgX 18-62 -->
          <rect x="18" y="0" width="44" height="18" fill="none" stroke="#3d6b3d" stroke-width="0.5"/>

          <!-- Six-yard box: sbX 114-120 → svgY 0-6, sbY 30-50 → svgX 30-50 -->
          <rect x="30" y="0" width="20" height="6"  fill="none" stroke="#3d6b3d" stroke-width="0.5"/>

          <!-- Penalty arc (below penalty area, svgY > 18) -->
          <path d="M 32 18 A 10 10 0 0 1 48 18" fill="none" stroke="#3d6b3d" stroke-width="0.5"/>

          <!-- Penalty spot: sbX=108→svgY=12, sbY=40→svgX=40 -->
          <circle cx="40" cy="12" r="0.6" fill="#3d6b3d"/>

          <!-- Goal (above pitch) -->
          <rect x="36" y="-2.5" width="8" height="2.5" fill="none" stroke="white" stroke-width="0.7"/>

          <!-- Pitch boundary -->
          <rect x="0" y="0" width="80" height="60" fill="none" stroke="#3d6b3d" stroke-width="0.6"/>

          ${circles}
        </svg>

        <div style="width:155px;flex-shrink:0">
          <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">Filter</div>
          ${filters}
          <div style="margin-top:14px">
            <div class="shot-stat"><div class="label">Shots</div><div class="value">${totalShots}</div></div>
            <div class="shot-stat"><div class="label">Goals</div><div class="value" style="color:var(--green)">${totalGoals}</div></div>
            <div class="shot-stat"><div class="label">Total xG</div><div class="value" style="color:var(--yellow)">${totalXg}</div></div>
            <div style="font-size:10px;color:var(--muted);margin-top:8px">Circle size = xG</div>
          </div>
        </div>

      </div>`;
  }

  function renderTable(data) {
    if (data === null || data === undefined) return '<p style="color:var(--muted)">No data returned</p>';
    const rows = normaliseData(data);
    if (!rows.length) return '<p style="color:var(--muted)">Empty result</p>';
    const cols = Object.keys(rows[0]);
    return `<div class="table-wrap"><table>
      <thead><tr>${cols.map(c => `<th>${c.replace(/_/g,' ')}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r => `<tr>${cols.map(c => {
        const v = r[c];
        const isGoal = c === 'goals' || c === 'total_goals';
        const isNum  = typeof v === 'number' && !isGoal;
        const cls    = isGoal && v > 0 ? 'goal' : isNum ? 'num' : '';
        const fmt    = typeof v === 'number' ? (Number.isInteger(v) ? v : v.toFixed(3)) : (v ?? '—');
        return `<td class="${cls}">${fmt}</td>`;
      }).join('')}</tr>`).join('')}</tbody>
    </table></div>`;
  }

  // WebR's toJs() returns nested {type, names, values} objects — flatten to plain rows
  function normaliseData(data) {
    if (Array.isArray(data)) {
      // Already array of plain objects
      if (data.length && typeof data[0] === 'object' && !data[0].type) return data;
      // WebR columnar format: [{names, values}] or single object with names/values
      if (data.length && data[0]?.names) {
        return transposeColumnar(data[0]);
      }
    }
    if (data && data.names && data.values) return transposeColumnar(data);
    // Flat object (single row)
    if (data && typeof data === 'object' && !Array.isArray(data)) return [data];
    return [];
  }

  function transposeColumnar(obj) {
    const { names, values } = obj;
    if (!names || !values) return [];
    const len = values[0]?.values?.length ?? 0;
    return Array.from({ length: len }, (_, i) => {
      const row = {};
      names.forEach((name, j) => {
        const col = values[j];
        row[name] = col?.values?.[i] ?? col?.[i] ?? null;
      });
      return row;
    });
  }

  function initOverviewChart({ teams, goals, xg, passAcc, dribble }) {
    const ctx = document.getElementById('overview-chart');
    if (!ctx) return null;
    return new Chart(ctx, {
      type: 'bar',
      data: {
        labels: teams,
        datasets: [
          { label: 'Goals',         data: goals,   backgroundColor: '#3fb950' },
          { label: 'xG',            data: xg,      backgroundColor: '#d2992280', borderColor: '#d29922', borderWidth: 1 },
          { label: 'Pass Acc %',    data: passAcc, backgroundColor: '#58a6ff80', borderColor: '#58a6ff', borderWidth: 1 },
          { label: 'Dribble Succ %',data: dribble, backgroundColor: '#8957e580', borderColor: '#8957e5', borderWidth: 1 },
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          legend: { labels: { color: '#8b949e', boxWidth: 12, font: { size: 11 } } }
        },
        scales: {
          x: { ticks: { color: '#8b949e', font: { size: 11 } }, grid: { color: '#30363d' } },
          y: { ticks: { color: '#8b949e', font: { size: 11 } }, grid: { color: '#30363d' } }
        }
      }
    });
  }

  function flattenRow(arr) {
    if (!arr.length) return {};
    const obj = arr[0];
    if (obj.names && obj.values) {
      const out = {};
      obj.names.forEach((n, i) => { out[n] = obj.values[i]?.values?.[0] ?? obj.values[i]; });
      return out;
    }
    return obj;
  }
</script>
